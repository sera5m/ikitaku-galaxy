<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ikitaku galaxy</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #e8c36a; font: 13px ui-monospace, monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 8px; padding: 8px; background: rgba(0,0,0,.7); }
  #bar input, #bar select, #bar button { background: #1a1208; color: #e8c36a; border: 1px solid #5a3a10; padding: 4px 8px; }
  #info { position: fixed; bottom: 8px; left: 8px; z-index: 2; max-width: 48ch; background: rgba(0,0,0,.75); padding: 8px; }
  #info .en { color: #ffe08a; font-size: 15px; }
  #info .chunk { color: #a08050; white-space: pre-wrap; margin-top: 4px; }
  #list { position: fixed; top: 44px; right: 8px; z-index: 2; width: 28ch; max-height: 70vh; overflow: auto;
          background: rgba(0,0,0,.7); padding: 8px; }
  #list h2 { margin: 0 0 6px; font-size: 12px; color: #a08050; }
  #list ol { margin: 0; padding-left: 1.4em; }
  #list li { cursor: pointer; }
  #list li:hover { color: #fff; }
  #graph { position: absolute; inset: 0; }
</style>
<script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
<div id="bar">
  <input id="q" placeholder="keyword" />
  <select id="rank"><option value="">all ranks</option></select>
  <button id="fit">fit</button>
  <label><input type="checkbox" id="dim2" /> 2D</label>
  <span id="src">memory: …</span>
</div>
<div id="list"><h2>index of memory file</h2><ol id="idx"></ol></div>
<div id="info"><div class="en">click a node</div><div class="chunk"></div></div>
<div id="graph"></div>
<script>
/* Memory lives in ikitaku-engine. Galaxy only views it.
   Tried in order: local copy (npm sync), then the engine repo raw. */
const MEMORY_URLS = [
  "memory/graph.json",
  "https://raw.githubusercontent.com/sera5m/ikitaku-engine/main/memory/graph.json"
];
const RANK_COLOR = { 5: "#ffb000", 4: "#e07020", 3: "#c0a060", 2: "#806040", 1: "#504030", 0: "#303030" };
let data = { nodes: [], links: [] };
const Graph = ForceGraph3D()(document.getElementById("graph"))
  .backgroundColor("#0a0a0a")
  .nodeLabel(n => (n.english || n.label) + "  r" + n.rank)
  .nodeColor(n => RANK_COLOR[n.rank] || "#888")
  .nodeVal(n => 4 - (n.rank || 0) * 0.3)
  .linkLabel(l => l.rel || "")
  .linkColor(() => "#5a3a10")
  .onNodeClick(show);
function show(n) {
  const info = document.getElementById("info");
  const edges = data.links
    .filter(l => (l.source.id || l.source) === n.id || (l.target.id || l.target) === n.id)
    .map(l => {
      const s = l.source.id || l.source, t = l.target.id || l.target;
      return (s === n.id ? "→ " : "← ") + (s === n.id ? t : s) + "  " + (l.rel || "");
    });
  info.innerHTML =
    `<div class="en">${n.english || n.label}</div>` +
    `<div class="chunk">${n.label}  r${n.rank}  ${n.kind || ""}\n${edges.join("\n") || "(no edges)"}</div>`;
}
function indexList(nodes) {
  const ol = document.getElementById("idx");
  ol.innerHTML = "";
  nodes.slice().sort((a, b) => (b.rank - a.rank) || a.label.localeCompare(b.label))
    .forEach((n, i) => {
      const li = document.createElement("li");
      li.textContent = n.label;
      li.title = n.english || "";
      li.onclick = () => { Graph.centerAt(n.x, n.y, n.z, 400); show(n); };
      ol.appendChild(li);
    });
}
function load(d, src) {
  data = d;
  document.getElementById("src").textContent = "memory: " + src;
  const ranks = [...new Set(d.nodes.map(n => n.rank))].sort((a,b)=>b-a);
  const sel = document.getElementById("rank");
  sel.innerHTML = "<option value=''>all ranks</option>" +
    ranks.map(r => `<option value="${r}">r${r}</option>`).join("");
  indexList(d.nodes);
  apply();
}
function apply() {
  const q = document.getElementById("q").value.toLowerCase();
  const r = document.getElementById("rank").value;
  const nodes = data.nodes.filter(n =>
    (!q || (n.label||"").toLowerCase().includes(q) ||
            (n.english||"").toLowerCase().includes(q) ||
            (n.id||"").toLowerCase().includes(q)) &&
    (!r || String(n.rank) === r));
  const ids = new Set(nodes.map(n => n.id));
  const links = data.links.filter(l => ids.has(l.source.id || l.source) && ids.has(l.target.id || l.target));
  Graph.graphData({ nodes, links });
  indexList(nodes);
}
async function boot() {
  for (const url of MEMORY_URLS) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      load(await r.json(), url);
      return;
    } catch (e) { /* next */ }
  }
  document.getElementById("src").textContent = "memory: missing";
}
document.getElementById("q").oninput = apply;
document.getElementById("rank").onchange = apply;
document.getElementById("fit").onclick = () => Graph.zoomToFit(400);
document.getElementById("dim2").onchange = e => Graph.numDimensions(e.target.checked ? 2 : 3);
boot();
</script>
</body>
</html>
